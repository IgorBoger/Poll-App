<header class="site-header" [class.site-header--dark]="darkLogo()">
  <a
    (click)="homeRequested.emit()"
    class="site-header__link"
    routerLink="/"
    aria-label="PollApp home"
  >
    <img
      class="site-header__link__logo"
      [src]="
        darkLogo() ? 'images/survey-form/poll-app-logo-dark.png' : 'images/poll-app-logo.svg.png'
      "
      alt=""
      width="64"
      height="32"
    />
    <span class="site-header__logo-text">
      <span>Poll</span>
      <span>App</span>
    </span>
  </a>
</header>
