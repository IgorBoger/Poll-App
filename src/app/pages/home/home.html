@if (selectedSurveyId()) {
  <main-survey-view
    (closeRequested)="onCancel()"
    [surveyId]="selectedSurveyId()"
    (newSurveyRequested)="isSurveyFormOpen.set(true)"
  >
    <main-header [darkLogo]="true" (homeRequested)="onCancel()"></main-header>
  </main-survey-view>
} @else {
  <main-header></main-header>

  <main>
    <main-hero (newSurveyRequested)="isSurveyFormOpen.set(true)"></main-hero>
    <main-survey-overview (surveyRequested)="selectedSurveyId.set($event)"></main-survey-overview>
    <main-survey-list (surveyRequested)="selectedSurveyId.set($event)"></main-survey-list>
  </main>
}

@if (isSurveyFormOpen()) {
  <main-survey-form
    (cancelRequested)="onCancel()"
    (publishedConfirmed)="onSurveyPublished($event)"
  ></main-survey-form>
}
