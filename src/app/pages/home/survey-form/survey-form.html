<div class="survey-form survey-form__overlay">
  <div class="survey-form__brand">
    <img src="images/survey-form/poll-app-logo-dark.png" width="69" height="50" alt="" />
    <span>Poll<br />App</span>
  </div>
  <section class="survey-form__panel" aria-labelledby="survey-form-heading">
    <header class="survey-form__header">
      <div>
        <span class="survey-form__draft">Draft</span>
        <h2 id="survey-form-heading">Create new survey</h2>
      </div>
      <button
        (click)="onCancelClick()"
        class="survey-form__secondary survey-form__cancel"
        type="button"
        aria-label="Cancel"
      >
        <span>Cancel</span>
        <img src="images/survey-form/cancel.png" width="14" height="14" alt="" />
      </button>
    </header>

    <form>
      <div class="survey-form__fields">
        <div>
          <label for="survey-name">Survey name</label>
          <div class="survey-form__field-action">
            <input id="survey-name" name="name" type="text" required />
            <button class="survey-form__delete" type="button" aria-label="Clear name" disabled>
              <img src="images/survey-form/delete.png" width="18" height="20" alt="" />
              <img src="images/survey-form/delete-dark.png" width="18" height="20" alt="" />
            </button>
          </div>

          <div class="survey-form__settings">
            <div class="survey-form__deadline">
              <label for="survey-deadline"
                >Set end date <span class="survey-form__optional">(optional)</span></label
              >
              <div class="survey-form__field-action">
                <input id="survey-deadline" name="deadline" type="text" />
                <button
                  class="survey-form__delete"
                  type="button"
                  aria-label="Clear deadline"
                  disabled
                >
                  <img src="images/survey-form/delete.png" width="18" height="20" alt="" />
                  <img src="images/survey-form/delete-dark.png" width="18" height="20" alt="" />
                </button>
              </div>
            </div>
            <div class="survey-form__category">
              <select
                class="survey-form__category-select"
                id="survey-category"
                name="category"
                aria-label="Choose category"
              >
                <option value="" hidden>Choose category</option>
                <option value="all">All surveys</option>
              </select>
              <span class="survey-form__category-arrow" aria-hidden="true">
                <img src="images/survey-form/category-arrow-down.png" alt="" />
                <img src="images/survey-form/category-arrow-down-accent.png" alt="" />
              </span>
            </div>
          </div>
        </div>

        <div>
          <label for="survey-description"
            >Describing text <span class="survey-form__optional">(optional)</span></label
          >
          <div class="survey-form__field-action">
            <textarea id="survey-description" name="description" rows="3"></textarea>
            <button
              class="survey-form__delete"
              type="button"
              aria-label="Clear description"
              disabled
            >
              <img src="images/survey-form/delete.png" width="18" height="20" alt="" />
              <img src="images/survey-form/delete-dark.png" width="18" height="20" alt="" />
            </button>
          </div>
        </div>

        <fieldset class="survey-form__question">
          <legend>
            <span class="survey-form__field-action">
              1. Question
              <button
                class="survey-form__delete"
                type="button"
                aria-label="Clear question 1"
                disabled
              >
                <img src="images/survey-form/delete.png" width="18" height="20" alt="" />
                <img src="images/survey-form/delete-dark.png" width="18" height="20" alt="" />
              </button>
            </span>
          </legend>
          <input name="question" type="text" aria-label="Question 1" required />

          <div class="survey-form__answers" role="group" aria-labelledby="survey-answers-label">
            <div class="survey-form__answers-header">
              <span id="survey-answers-label">Answers</span
              ><label class="survey-form__multiple">
                <span class="survey-form__checkbox">
                  <input name="multipleAnswers" type="checkbox" />
                  <img
                    src="images/survey-form/checkbox-outline.png"
                    width="15"
                    height="15"
                    alt=""
                  />
                </span>
                Allow multiple answers
              </label>
            </div>
            <div class="survey-form__field-action">
              <label class="survey-form__answer">
                <span aria-hidden="true">A.</span>
                <input name="answerA" type="text" aria-label="Answer A" required />
              </label>
              <button
                class="survey-form__delete"
                type="button"
                aria-label="Remove answer A"
                disabled
              >
                <img src="images/survey-form/delete.png" width="18" height="20" alt="" />
                <img src="images/survey-form/delete-dark.png" width="18" height="20" alt="" />
              </button>
            </div>
            <div class="survey-form__field-action">
              <label class="survey-form__answer">
                <span aria-hidden="true">B.</span>
                <input name="answerB" type="text" aria-label="Answer B" required />
              </label>
              <button
                class="survey-form__delete"
                type="button"
                aria-label="Remove answer B"
                disabled
              >
                <img src="images/survey-form/delete.png" width="18" height="20" alt="" />
                <img src="images/survey-form/delete-dark.png" width="18" height="20" alt="" />
              </button>
            </div>
            <button class="survey-form__add-answer" type="button" disabled>
              Add answer
              <img src="images/survey-form/add-answer.png" width="16" height="16" alt="" />
            </button>
          </div>
        </fieldset>

        <button class="survey-form__secondary survey-form__add-question" type="button" disabled>
          Add next question
          <img src="images/survey-form/add-question.png" width="20" height="20" alt="" />
        </button>
      </div>

      <footer class="survey-form__footer">
        <button class="survey-form__publish" type="submit" disabled>
          Publish
          <img src="images/survey-form/check.png" width="18" height="16" alt="" />
        </button>
      </footer>
    </form>
  </section>
</div>
