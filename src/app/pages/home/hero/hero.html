<section class="hero" aria-labelledby="hero-title">
  <div class="hero__content">
    <h1 class="hero__title" id="hero-title">Collect Feedback, Unlock Ideas</h1>
    <p class="hero__description">
      Create and share surveys in minutes – from team events to workplace culture.
      Collect opinions, engage your audience, and turn feedback into action.
    </p>
    <button class="hero__button" type="button" (click)="newSurveyRequested.emit()">
      <span>New survey</span>
      <span class="hero__button-icon" aria-hidden="true">
        <img src="images/hero/add_circle.png" alt="" width="20" height="20" />
      </span>
    </button>
  </div>

  <div class="hero__illustration" aria-hidden="true">
    <img class="hero__survey" src="images/hero/survey.png" alt="" />
    <img
      class="hero__speech-bubble"
      src="images/hero/speech-bubble-large.png"
      alt=""
    />
    <img class="hero__question-mark" src="images/hero/question-mark.png" alt="" />
    <img class="hero__star" src="images/hero/star.png" alt="" />
    <img class="hero__check" src="images/hero/check.png" alt="" />
  </div>
</section>
